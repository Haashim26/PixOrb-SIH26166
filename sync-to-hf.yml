name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          # >>> REPLACE the placeholder below with YOUR_HF_USERNAME/YOUR_SPACE_NAME <<<
          huggingface_repo_id: YOUR_HF_USERNAME/pixorb-sih26166
          hf_token: ${{ secrets.HF_TOKEN }}
          space_sdk: docker
